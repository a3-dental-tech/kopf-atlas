      <span><button class="btn klein" data-lupe="schmelzprisma">Lupe: Schmelzprismen</button><button class="btn klein" data-lupe="dentinkanaelchen">Lupe: Dentinkanälchen</button><button class="btn klein" data-lupe="">Ganzer Zahn</button></span></p>
    <div id="tafel" hidden><div class="t-kopf"><b id="tafelTitel"></b><span class="w-schema" id="tafelHinweis"></span><button class="btn klein haupt" id="tafelZu">× Schliessen</button></div><div class="t-bild"><img id="tafelBild" alt=""><span id="tafelPunkte"></span></div><ol id="tafelLegende"></ol><small id="tafelQuelle"></small></div>
    <div id="zeigTitel" hidden><b></b><span></span><button id="zeigPause" class="btn klein" hidden>❚❚ Pause</button><button id="zeigWeiter" class="btn klein" hidden>Weiter ▶▶</button><button id="zeigZu" class="btn klein" aria-label="Zeigen beenden">■ Stopp</button></div>
    <div id="gelenkFenster" hidden><div class="gf-reihe"><div data-g="sag"><b></b><span class="gf-punkte"></span><span class="gf-knopf"><button type="button" data-gz="-1" aria-label="kleiner">−</button><button type="button" data-gz="1" aria-label="grösser">+</button><button type="button" data-gm="1" aria-pressed="false">Muskeln</button></span></div><div data-g="fro"><b></b><span class="gf-punkte"></span><span class="gf-knopf"><button type="button" data-gz="-1" aria-label="kleiner">−</button><button type="button" data-gz="1" aria-label="grösser">+</button><button type="button" data-gm="1" aria-pressed="false">Muskeln</button></span></div></div><div class="gf-zeile"><b id="gfSeiten"></b><button class="btn klein" id="gfWechsel">anderes Gelenk</button></div><ol id="gfLegende" hidden></ol></div>
    <div id="filmKasten" hidden></div>
    <div id="weltPfad" hidden></div>
    <canvas id="weltWuerfel" width="336" height="336" hidden aria-label="Navigationskugel: ziehen dreht das Modell, ein Punkt wählt die Ansicht"></canvas>
    <button id="kugelModus" class="btn klein" hidden>Kopf-Richtungen</button>
    <div id="weltSpiel" hidden></div>
    <div id="scanLeiste" hidden>
      <b>Beispielgebiss (Intraoralscan)</b>
      <label class="schalter klein"><input type="checkbox" id="scanOk" checked><span class="regler"></span><span>Oberkiefer</span></label>
      <label class="schalter klein"><input type="checkbox" id="scanUk" checked><span class="regler"></span><span>Unterkiefer</span></label>
      <label class="scan-auf"><span>Mund öffnen <small>(schematisch)</small></span><input type="range" id="scanAuf" min="0" max="1" step="0.01" value="0"></label>
    </div>
    <div id="demoLeiste" hidden>
      <div class="d-text"><b id="dTitel"></b><span id="dText"></span></div>
      <div class="d-knoepfe">
        <button id="dPlay" class="btn haupt">▶ Play</button>
        <button id="dPause" class="btn">❚❚ Pause</button>
        <button id="dWeiter" class="btn">Weiter ▶▶</button>
        <button id="dStopp" class="btn">■ Stopp</button>
        <span id="dZahl"></span>
      </div>
      <div class="balken"><i id="dBalken"></i></div>
    </div>
    <div id="toast" hidden></div>
  </main>

  <aside id="rechts" aria-label="Info">
    <button id="griff" aria-label="Karte öffnen oder schliessen"><i></i></button>
    <div id="vorleseLeiste">
      <button id="vorlesen" class="btn haupt">🔊 Vorlesen</button>
      <button id="stopp" class="btn" hidden>■ Stopp</button>
      <label class="schalter klein"><input type="checkbox" id="autoLesen"><span class="regler"></span><span>Automatisch vorlesen</span></label>
      <details id="stimmeBox"><summary>Stimme</summary>
        <label>Stimme <select id="stimme"></select></label>
        <label>Tempo <input type="range" id="tempo" min="0.6" max="1.4" step="0.05"> <output id="tempoWert"></output></label>
      </details>
      <p id="stimmeMeldung" role="status"></p>
    </div>
    <div id="modulInfo" hidden></div>
    <div id="karte"></div>
    <div id="listePanel" hidden></div>
    <div id="playPanel" hidden></div>
    <div id="quizPanel" hidden></div>
  </aside>

  <nav id="unten" aria-label="Navigation">
    <button data-auf="links">☰<span>Ebenen</span></button>
    <button data-menu="atlas" class="an">◉<span>Atlas</span></button>
    <button data-menu="play">▶<span>Play</span></button>
    <button data-menu="quiz">?<span>Quiz</span></button>
    <button data-menu="welt">◈<span>Zahn-Welt</span></button>
    <button data-menu="gelenk" aria-label="Gelenk und Bewegungen">⇄<span>Gelenk</span></button>
    <button data-menu="artikulator">⚙<span>Artiku&shy;lator</span></button>
    <button data-menu="prothese">◡<span>Total&shy;prothese</span></button>
    <button data-auf="rechts">▤<span>Info</span></button>
  </nav>
</div>

<dialog id="quellen"><div class="dlg"><button class="zu" data-dlg="quellen" aria-label="Schliessen">×</button><div id="quellenInhalt"></div></div></dialog>
<dialog id="infoDlg"><div class="dlg"><button class="zu" data-dlg="infoDlg" aria-label="Schliessen">×</button>
  <div class="dlg-lesen"><button id="infoVorlesen" class="btn haupt">🔊 Vorlesen</button><button id="infoStopp" class="btn">■ Stopp</button></div><div id="infoInhalt"></div></div></dialog>
<script src="daten.js"></script>
<script src="app.js"></script>
</body>
</html>
